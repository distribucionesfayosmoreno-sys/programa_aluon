<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario Pedido · Vallas</title>
    <link rel="stylesheet" href="./form-template.css" />
  </head>
  <body>
    <main class="sheet">
      <div class="form-canvas">
        <img
          class="form-bg"
          alt="Formulario pedido vallas"
          src="../Formulario-pedido-Aluon-Distribuidores- VALLAS.jpg"
        />

        <div id="distributor" class="field" data-field="distributor"></div>
        <div id="quoteNumber" class="field mono" data-field="quoteNumber"></div>
        <div id="date" class="field mono" data-field="date"></div>

        <div id="doorModel" class="field" data-field="doorModel"></div>
        <div id="colorRef" class="field" data-field="colorRef"></div>
        <div id="finish" class="field" data-field="finish"></div>

        <div id="widthCm" class="field mono" data-field="widthCm"></div>
        <div id="heightCm" class="field mono" data-field="heightCm"></div>

        <div id="installerName" class="field" data-field="installerName"></div>
        <div id="observations" class="field multiline" data-field="observations"></div>
      </div>
    </main>

    <script type="module">
      import { mountTemplate } from "./form-template.js";

      mountTemplate({
        baseWidth: 2043,
        baseHeight: 3043,
        rects: {
          distributor: { x: 30, y: 300, w: 1100, h: 70 },
          quoteNumber: { x: 1165, y: 300, w: 470, h: 70 },
          date: { x: 1675, y: 300, w: 350, h: 70 },

          doorModel: { x: 30, y: 470, w: 1100, h: 70 },
          colorRef: { x: 1165, y: 470, w: 470, h: 70 },
          finish: { x: 1675, y: 470, w: 350, h: 70 },

          widthCm: { x: 850, y: 1465, w: 360, h: 54 },
          heightCm: { x: 1740, y: 1025, w: 260, h: 54 },

          observations: { x: 20, y: 2390, w: 2005, h: 200 },
          installerName: { x: 1400, y: 2325, w: 625, h: 62 },
        },
        data: {
          distributor: "__DISTRIBUIDOR__",
          quoteNumber: "__PRESUPUESTO__",
          date: "__FECHA__",
          doorModel: "__MODELO__",
          colorRef: "__COLOR_REF__",
          finish: "__ACABADO__",
          widthCm: "__ANCHO_CM__",
          heightCm: "__ALTO_CM__",
          installerName: "__NOMBRE__",
          observations: "__OBSERVACIONES__",
        },
      });
    </script>
  </body>
</html>
