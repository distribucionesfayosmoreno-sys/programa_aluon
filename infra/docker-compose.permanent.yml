name: aluon-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aluonbbdd
      POSTGRES_USER: aluon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the environment file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aluon -d aluonbbdd"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backend:
    image: aluon-backend:local
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aluonbbdd
      SPRING_DATASOURCE_USERNAME: aluon
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the environment file}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://192.168.99.61:5174,https://desarrollowebaluon.iconseriespeliculas.xyz}
      DOOR_SIMULATION_LOCAL_BASE_DIR: /app/door-simulation-assets
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - assets:/app/door-simulation-assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/customers || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    logging: *logging

  frontend:
    image: aluon-frontend:local
    build:
      context: ../frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  router:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./nginx-local-router.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
    name: aluon-permanent-pgdata
  assets:
    name: aluon-permanent-assets
